#==============================================================================
# neonatox-bootstrap.conf
#------------------------------------------------------------------------------
# Archivo de configuración de ejemplo para neonatox-bootstrap.
#
# Se instala tal cual en @NB_SYSCONFDIR@/neonatox-bootstrap.conf y también se
# lee desde el directorio del script cuando se ejecuta el source tree.
#
# Precedencia:
#   1. Opciones de línea de comandos
#   2. Valores activos en ESTE archivo
#   3. Variables de entorno heredadas
#   4. Defaults del script
#
# Todo está comentado salvo el perfil NETINSTALL. Descomenta lo que quieras
# fijar. Las variables NHOPKG_* exportadas son vistas por nhopkg; aquellas que
# nhopkg asigna literalmente en su.conf deben ir en NHOPKG_CONF_OVERRIDES.
#
# zstd y BusyBox los provee neonatox-live-boot: este bootstrap no los compila
# ni descarga en el perfil de netinstall.
#==============================================================================

#------------------------------------------------------------------------------
# Perfil NETINSTALL (activo)
#------------------------------------------------------------------------------
# Reutiliza el nhopkg del live-boot: no clona, no compila, no instala estáticos.
HOST_NHOPKG=1
# NB_HOST_NHOPKG=1              # alias por entorno (equivalente a HOST_NHOPKG=1)

# nhopkg imprime mensajes fuente; no depende de gettext.
export NHOPKG_GETTEXT="no"

# No anteponer el PATH privado de BusyBox en el host. El live ya provee el
# userspace; BusyBox está disponible pero no se usa como PATH de nhopkg.
export NHOPKG_USE_BUSYBOX="no"

#------------------------------------------------------------------------------
# Rutas y arranque
#------------------------------------------------------------------------------
# NB_CONFIG="${NB_CONFIG:-@NB_SYSCONFDIR@/neonatox-bootstrap.conf}"
# DATA_DIR="${DATA_DIR:-@NB_DATADIR@/data}"
# PACKS_DIR="${PACKS_DIR:-@NB_DATADIR@/packs}"

#------------------------------------------------------------------------------
# Target (comandos core / DE / --create-sysroot)
#------------------------------------------------------------------------------
# LFS="${LFS:-/mnt}"            # NUNCA "/" (aborta: protege el host)
# NHOSTNAME="${NHOSTNAME:-}"    # auto: DMI + aleatorio
# TZONE="${TZONE:-America/Caracas}"
# LOCALE="${LOCALE:-en_US.UTF-8}"
# LIBC="${LIBC:-glibc}"         # glibc | musl (ambos usan repo n27)

# --create-sysroot: modo propio, crea SOLO la jerarquía de directorios y sale.
# Fija LIBC; no genera fstab, no instala nhopkg/paquetes y no crea sentinels.
# CREATE_SYSROOT="${CREATE_SYSROOT:-}"   # glibc | musl

# fstab (solo core). bootstrap NUNCA formatea: --fstype solo se escribe en fstab.
# DEVICE_OVERRIDE="${DEVICE_OVERRIDE:-}"       # --device (default: findmnt/df)
# UUID_OVERRIDE="${UUID_OVERRIDE:-}"           # --uuid (default: blkid)
# FSTYPE_OVERRIDE="${FSTYPE_OVERRIDE:-}"       # --fstype (default: blkid)
# SUBVOL_OVERRIDE="${SUBVOL_OVERRIDE:-}"       # --subvol (btrfs; default: findmnt)
# ROOT_OPTS_OVERRIDE="${ROOT_OPTS_OVERRIDE:-}" # --root-opts (reemplaza el default)
# ROOT_PASSNO="${ROOT_PASSNO:-}"               # --root-passno (0 btrfs / 1 otros)
# SWAP_MODE="${SWAP_MODE:-auto}"               # --swap: auto | none | UUID
# EFI_UUID_OVERRIDE="${EFI_UUID_OVERRIDE:-}"   # --efi-uuid (default: blkid)
# EFI_MOUNT_OVERRIDE="${EFI_MOUNT_OVERRIDE:-}" # --efi-mount (default: detectado o /boot)
# NO_EFI_ENTRY="${NO_EFI_ENTRY:-}"             # --no-efi-entry
# SKIP_FSTAB="${SKIP_FSTAB:-}"                 # --no-fstab

#------------------------------------------------------------------------------
# Driver / build de nhopkg
#------------------------------------------------------------------------------
# BUSYBOX="${BUSYBOX:-0}"       # 0 = sin BusyBox (solo aplica si se construye)
# SKIP_SENTINEL="${SKIP_SENTINEL:-${NB_SKIP_SENTINEL:-0}}"
# NB_SKIP_SENTINEL="${NB_SKIP_SENTINEL:-0}"
# SKIP_CLEANUP="${SKIP_CLEANUP:-}"

# Args extra para el meson de nhopkg (solo si HOST_NHOPKG=0). Último -D gana.
# NHOPKG_MESON_ARGS="${NHOPKG_MESON_ARGS:--D use-busybox=no -D static-busybox=no -D static-zstd=no}"

# Conf del host a usar cuando HOST_NHOPKG=1. Si no se define, se usa la del
# nhopkg del live. Si el live trae una conf vieja (n2026), define NB_NHOPKG_CONF
# o usa NHOPKG_CONF_OVERRIDES (se aplica sobre una copia temporal).
# NB_NHOPKG_CONF="${NB_NHOPKG_CONF:-}"

# Líneas que se añaden al final de la conf de nhopkg. En host-mode se escriben
# en una copia temporal de la conf del host; en target-mode se escriben en
# $LFS/etc/nhopkg/nhopkg.conf. Ejemplo de una sola línea (separadas por ';'):
# export NHOPKG_CONF_OVERRIDES='NHOPKG_REPO_CORE="https://mirror/.../core"; NHOGET_TIMEOUT="60"'

# Directorio/setup de BusyBox del live si NHOPKG_USE_BUSYBOX=yes:
# export NB_NHOPKG_BB_DIR="${NB_NHOPKG_BB_DIR:-/usr/lib/nhopkg/bin}"
# export NB_NHOPKG_BB_SETUP="${NB_NHOPKG_BB_SETUP:-/usr/lib/nhopkg/nhopkg-bb-setup}"
# export NHOPKG_BB_DIR="${NHOPKG_BB_DIR:-/usr/lib/nhopkg/bin}"
# export NHOPKG_BB_SETUP="${NHOPKG_BB_SETUP:-/usr/lib/nhopkg/nhopkg-bb-setup}"

# Paths del nhopkg construido en el target (HOST_NHOPKG=0). El bootstrap los
# exporta automáticamente apuntando dentro de $LFS.
# export NHOPKG_CONF="${LFS}/etc/nhopkg/nhopkg.conf"
# export NHOPKG_LIB="${LFS}/usr/lib/nhopkg/libnhopkg"
# export NHOPKG_UDEP_LIB="${LFS}/usr/lib/nhopkg/libnhopkg_udepsys"
# export NHOPKG_DOWNLOAD_LIB="${LFS}/usr/lib/nhopkg/libnhopkg_download"
# export NHOPKG_CRYPTO_LIB="${LFS}/usr/lib/nhopkg/libnhopkg_crypto"

